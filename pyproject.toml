[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grade"
version = "0.1.0"
description = "A two-layer graph representation of LLM-agent runs (execution and dependency)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Anonymous" }]
keywords = ["agents", "graph", "failure-prediction", "fault-localization", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["networkx>=3.0"]

[project.optional-dependencies]
# Non-GNN experiment scripts and corpus loaders.
experiments = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "huggingface_hub>=0.20",
    "datasets>=2.14",
    "pyarrow>=12.0",
]
# Off-the-shelf graph-network baselines (graph_gnn*.py).
gnn = [
    "torch>=2.0",
    "torch_geometric>=2.4",
]
# Test runner for the hermetic core tests.
dev = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/grade"]
